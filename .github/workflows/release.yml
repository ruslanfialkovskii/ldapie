# LDAPie Release Workflow (Improved)
#
# This workflow handles the release process for LDAPie, including:
# - Version validation and incrementation
# - Updating version numbers in code
# - Running tests to ensure release quality
# - Creating a GitHub release with release notes
# - Publishing to PyPI
# - Building and pushing Docker images for multiple platforms
# - Updating documentation
#
# It is designed to be triggered manually with custom inputs for release type,
# version number, and other release options.
#
# Workflow inputs are never interpolated into scripts: they are passed through
# step-level `env:` and referenced as quoted shell variables.
#
# Actions are pinned to commit SHAs (the comment names the version); Dependabot
# proposes updates. Dependencies come from uv.lock (`--locked` fails on a stale lock). PyPI publishing uses Trusted Publishing (OIDC), so no API
# token is stored; see RELEASE.md for the one-time PyPI setup.

name: LDAPie Release Workflow (Improved)

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release to create'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: 'Specify exact version X.Y.Z (optional, leave empty for auto-increment)'
        required: false
        type: string
      pre_release:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as draft release?'
        required: false
        default: false
        type: boolean
      changelog_message:
        description: 'Custom changelog entry (optional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare Release
    # The version bump is pushed to main, so only release from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Push the version-bump commit and tag with the built-in GITHUB_TOKEN.
    # Pushes made with it do not trigger other workflows (no CI run on the bump).
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
      current_version: ${{ steps.get_current_version.outputs.current_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Get current version
        id: get_current_version
        run: |
          current_version=$(PYTHONPATH=src python -c "from ldapie import __version__; print(__version__)")
          echo "current_version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "Current version: ${current_version}"

      - name: Bump version
        id: bump_version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Dry run only: compute (and validate) the new version, write nothing
          set -- "$RELEASE_TYPE" --dry-run
          if [ -n "$INPUT_VERSION" ]; then
            echo "Using specified version: $INPUT_VERSION"
            set -- "$@" --set-version "$INPUT_VERSION"
          else
            echo "Calculating new version based on release type: $RELEASE_TYPE"
          fi
          if ! output=$(python scripts/bump_version.py "$@" 2>&1); then
            echo "$output"
            exit 1
          fi
          echo "$output"
          new_version=$(printf '%s\n' "$output" | sed -n 's/^New version: //p')
          if ! printf '%s' "$new_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Could not determine a valid new version (got '${new_version}')"
            exit 1
          fi
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "New version will be: ${new_version}"

      - name: Update version numbers
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          INPUT_VERSION: ${{ inputs.version }}
          CHANGELOG_MESSAGE: ${{ inputs.changelog_message }}
          NEW_VERSION: ${{ steps.bump_version.outputs.new_version }}
        run: |
          set -- "$RELEASE_TYPE"
          if [ -n "$INPUT_VERSION" ]; then
            set -- "$@" --set-version "$INPUT_VERSION"
          fi
          if [ -n "$CHANGELOG_MESSAGE" ]; then
            # "=" form so a message starting with "-" is not parsed as an option
            set -- "$@" "--changelog-message=${CHANGELOG_MESSAGE}"
          fi
          python scripts/bump_version.py "$@"

          # Verify the version was updated correctly
          updated_version=$(PYTHONPATH=src python -c "from ldapie import __version__; print(__version__)")
          echo "Updated version in code: ${updated_version}"
          if [ "$updated_version" != "$NEW_VERSION" ]; then
            echo "Version mismatch: ${updated_version} != ${NEW_VERSION}"
            exit 1
          fi

      - name: Commit version changes
        env:
          NEW_VERSION: ${{ steps.bump_version.outputs.new_version }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Only tracked files changed by the bump (version file and changelog)
          git add -u
          git commit -m "Bump version to ${NEW_VERSION}"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"

          # actions/checkout left GITHUB_TOKEN credentials in place; push branch and tag together
          git push --atomic origin main "v${NEW_VERSION}"

  test-release:
    name: Test Release
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      # uv uses the interpreter setup-python installed, not a cached one of its own
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ needs.prepare-release.outputs.new_version }}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra test

      - name: Run tests with coverage (same as make cov)
        run: uv run --locked make cov

      - name: Test regular (non-editable) package installation
        run: |
          # What `pip install ldapie` gives a user, outside the uv environment
          python -m pip install --upgrade pip
          pip install .
          # Run from outside the checkout so the installed package is the one imported
          cd "$RUNNER_TEMP"
          python -c "import ldapie; print(ldapie.__version__)"
          ldapie --help > /dev/null

  build-package:
    name: Build Python Package
    needs: [prepare-release, test-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ needs.prepare-release.outputs.new_version }}"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          python-version: '3.10'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Build package
        run: uv build

      - name: Check package
        run: uv run --locked twine check dist/*

      - name: Verify built version matches the release
        env:
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        run: |
          ls -la dist/
          test -f "dist/ldapie-${NEW_VERSION}-py3-none-any.whl"
          test -f "dist/ldapie-${NEW_VERSION}.tar.gz"

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/
          retention-days: 7

  publish-package:
    name: Publish to PyPI
    needs: [prepare-release, build-package]
    runs-on: ubuntu-latest
    environment: PyPI
    # Trusted Publishing: PyPI accepts this workflow's OIDC token instead of an API token
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist/

      - name: List package files
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  build-docker:
    name: Build and Push Docker Image
    needs: [prepare-release, test-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ needs.prepare-release.outputs.new_version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ruslanfialkovsky/ldapie:latest
            ruslanfialkovsky/ldapie:${{ needs.prepare-release.outputs.new_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    needs: [prepare-release, publish-package, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release and upload assets
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ needs.prepare-release.outputs.new_version }}"

      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist/

      - name: Compose release notes
        env:
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
          CURRENT_VERSION: ${{ needs.prepare-release.outputs.current_version }}
        run: |
          # Changelog entries are "# X.Y.Z (date)" (bump script) or "## X.Y.Z (date)" (older entries)
          awk -v v="$NEW_VERSION" '
            $1 ~ /^##?$/ { flag = ($2 == v); next }
            flag
          ' CHANGELOG.md > release_notes.txt

          {
            printf '# LDAPie v%s\n\n' "$NEW_VERSION"
            cat release_notes.txt
            printf '\n## Installation\n\n```bash\npip install ldapie==%s\n```\n' "$NEW_VERSION"
            printf '\n## Docker\n\n```bash\ndocker pull ruslanfialkovsky/ldapie:%s\n```\n' "$NEW_VERSION"
            printf '\n## Changes\n\nVersion %s from %s\n' "$NEW_VERSION" "$CURRENT_VERSION"
          } > release_body.md
          cat release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.prepare-release.outputs.new_version }}
          name: Release v${{ needs.prepare-release.outputs.new_version }}
          body_path: release_body.md
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.pre_release }}
          files: |
            dist/*
          fail_on_unmatched_files: true
