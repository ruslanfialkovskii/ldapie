# LDAPie Release Workflow (Improved)
#
# This workflow handles the release process for LDAPie, including:
# - Version validation and incrementation
# - Updating version numbers in code
# - Running tests to ensure release quality
# - Creating a GitHub release with release notes
# - Publishing to PyPI
# - Building and pushing Docker images for multiple platforms
# - Updating documentation
#
# It is designed to be triggered manually with custom inputs for release type,
# version number, and other release options.
#
# Workflow inputs are never interpolated into scripts: they are passed through
# step-level `env:` and referenced as quoted shell variables.

name: LDAPie Release Workflow (Improved)

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release to create'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: 'Specify exact version X.Y.Z (optional, leave empty for auto-increment)'
        required: false
        type: string
      pre_release:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as draft release?'
        required: false
        default: false
        type: boolean
      changelog_message:
        description: 'Custom changelog entry (optional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare Release
    # The version bump is pushed to main, so only release from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
      current_version: ${{ steps.get_current_version.outputs.current_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}  # Use a PAT instead of GITHUB_TOKEN

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Get current version
        id: get_current_version
        run: |
          current_version=$(python -c "from ldapie import __version__; print(__version__)")
          echo "current_version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "Current version: ${current_version}"

      - name: Bump version
        id: bump_version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Dry run only: compute (and validate) the new version, write nothing
          set -- "$RELEASE_TYPE" --dry-run
          if [ -n "$INPUT_VERSION" ]; then
            echo "Using specified version: $INPUT_VERSION"
            set -- "$@" --set-version "$INPUT_VERSION"
          else
            echo "Calculating new version based on release type: $RELEASE_TYPE"
          fi
          if ! output=$(python scripts/bump_version.py "$@" 2>&1); then
            echo "$output"
            exit 1
          fi
          echo "$output"
          new_version=$(printf '%s\n' "$output" | sed -n 's/^New version: //p')
          if ! printf '%s' "$new_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Could not determine a valid new version (got '${new_version}')"
            exit 1
          fi
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "New version will be: ${new_version}"

      - name: Update version numbers
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          INPUT_VERSION: ${{ inputs.version }}
          CHANGELOG_MESSAGE: ${{ inputs.changelog_message }}
          NEW_VERSION: ${{ steps.bump_version.outputs.new_version }}
        run: |
          set -- "$RELEASE_TYPE"
          if [ -n "$INPUT_VERSION" ]; then
            set -- "$@" --set-version "$INPUT_VERSION"
          fi
          if [ -n "$CHANGELOG_MESSAGE" ]; then
            # "=" form so a message starting with "-" is not parsed as an option
            set -- "$@" "--changelog-message=${CHANGELOG_MESSAGE}"
          fi
          python scripts/bump_version.py "$@"

          # Verify the version was updated correctly
          updated_version=$(python -c "from ldapie import __version__; print(__version__)")
          echo "Updated version in code: ${updated_version}"
          if [ "$updated_version" != "$NEW_VERSION" ]; then
            echo "Version mismatch: ${updated_version} != ${NEW_VERSION}"
            exit 1
          fi

      - name: Commit version changes
        env:
          NEW_VERSION: ${{ steps.bump_version.outputs.new_version }}
          PUSH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Only tracked files changed by the bump (version file and changelog)
          git add -u
          git commit -m "Bump version to ${NEW_VERSION}"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"

          # Use the token explicitly in the push commands; push branch and tag together
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --atomic origin main "v${NEW_VERSION}"

  test-release:
    name: Test Release
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.prepare-release.outputs.new_version }}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests with pytest
        run: pytest --cov=ldapie tests/

      - name: Test regular (non-editable) package installation
        run: |
          pip uninstall -y ldapie
          pip install .
          # Run from outside the checkout so the installed package is the one imported
          cd "$RUNNER_TEMP"
          python -c "import ldapie; print(ldapie.__version__)"
          ldapie --help > /dev/null

  build-package:
    name: Build Python Package
    needs: [prepare-release, test-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.prepare-release.outputs.new_version }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Verify built version matches the release
        env:
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        run: |
          ls -la dist/
          test -f "dist/ldapie-${NEW_VERSION}-py3-none-any.whl"
          test -f "dist/ldapie-${NEW_VERSION}.tar.gz"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          retention-days: 7

  publish-package:
    name: Publish to PyPI
    needs: [prepare-release, build-package]
    runs-on: ubuntu-latest
    environment: PyPI
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: List package files
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  build-docker:
    name: Build and Push Docker Image
    needs: [prepare-release, test-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.prepare-release.outputs.new_version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ruslanfialkovsky/ldapie:latest
            ruslanfialkovsky/ldapie:${{ needs.prepare-release.outputs.new_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    needs: [prepare-release, publish-package, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.prepare-release.outputs.new_version }}"
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}  # Use personal access token

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Compose release notes
        env:
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
          CURRENT_VERSION: ${{ needs.prepare-release.outputs.current_version }}
        run: |
          # Changelog entries are "# X.Y.Z (date)" (bump script) or "## X.Y.Z (date)" (older entries)
          awk -v v="$NEW_VERSION" '
            $1 ~ /^##?$/ { flag = ($2 == v); next }
            flag
          ' CHANGELOG.md > release_notes.txt

          {
            printf '# LDAPie v%s\n\n' "$NEW_VERSION"
            cat release_notes.txt
            printf '\n## Installation\n\n```bash\npip install ldapie==%s\n```\n' "$NEW_VERSION"
            printf '\n## Docker\n\n```bash\ndocker pull ruslanfialkovsky/ldapie:%s\n```\n' "$NEW_VERSION"
            printf '\n## Changes\n\nVersion %s from %s\n' "$NEW_VERSION" "$CURRENT_VERSION"
          } > release_body.md
          cat release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}  # Use personal access token
          tag_name: v${{ needs.prepare-release.outputs.new_version }}
          name: Release v${{ needs.prepare-release.outputs.new_version }}
          body_path: release_body.md
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.pre_release }}
          files: |
            dist/*
          fail_on_unmatched_files: true
