# LDAPie Continuous Integration and Development Workflow
#
# This workflow handles continuous integration testing and verification of code quality.
# It runs on all pushes to main/master branches and pull requests.
#
# Actions are pinned to commit SHAs (the comment names the version); Dependabot
# proposes updates. Dependencies come from uv.lock (`--locked` fails on a stale
# lock), so CI tests what a release ships. The checks themselves are the
# Makefile targets, so `make` locally and CI run the same commands.
#
# Note: Publishing to PyPI and Docker Hub is handled by the dedicated release workflow
# (release.yml) which is triggered manually when creating a new release.

name: LDAPie CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  check:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          python-version: '3.10'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Lint, formatting, types and dependency audit (same as make)
        run: uv run --locked make lint format-check typecheck audit

  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra test

      - name: Run tests with coverage (same as make cov)
        run: uv run --locked make cov

  build-pip:
    name: Build Python Package
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          python-version: '3.10'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Build package
        run: uv build

      - name: Check package
        run: uv run --locked twine check dist/*

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/
          retention-days: 7

  build-docker:
    name: Build and Verify Docker Image
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Runs on pull requests too (Dependabot digest and lockfile bumps included);
      # only pushes to main write the build cache
      - name: Build Docker image (without pushing)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ruslanfialkovsky/ldapie:ci-test
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Smoke-test the image
        run: docker run --rm ruslanfialkovsky/ldapie:ci-test --version
