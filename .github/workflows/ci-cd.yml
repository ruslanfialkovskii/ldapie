# LDAPie Continuous Integration and Development Workflow
#
# This workflow handles continuous integration testing and verification of code quality.
# It runs on all pushes to main/master branches and pull requests.
#
# Note: Publishing to PyPI and Docker Hub is handled by the dedicated release workflow
# (release.yml) which is triggered manually when creating a new release.

name: LDAPie CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  check:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Check formatting with black
        run: black --check src tests scripts

      - name: Check imports with isort
        run: isort --check-only --profile black src tests scripts

      - name: Lint with flake8
        run: flake8 src tests scripts

      # Advisory until its backlog is cleared; flip to blocking by removing continue-on-error.
      - name: Lint with pylint
        run: pylint --rcfile=.pylintrc src/ldapie
        continue-on-error: true

      - name: Type check with mypy
        run: |
          # Same command as `make typecheck`
          cd src && PYTHONPATH=. mypy --config-file=../mypy.ini ldapie

  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests with pytest
        run: pytest --cov=ldapie tests/

  build-pip:
    name: Build Python Package
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          retention-days: 7

  build-docker:
    name: Build and Verify Docker Image
    needs: [check, test]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (without pushing)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ruslanfialkovsky/ldapie:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
