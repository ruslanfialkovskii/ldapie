[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ldapie"
description = "A modern LDAP client CLI tool inspired by HTTPie"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dynamic = ["version"]
authors = [
    {name = "LDAPie Team", email = "ruslan.fialkovsky@gmail.com"}
]
keywords = ["ldap", "cli", "directory", "admin", "tool"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
    "Topic :: Utilities",
]
dependencies = [
    "ldap3>=2.9,<3.0",
    # ldap3 only asks for pyasn1>=0.4.6. pyasn1 decodes every server response, and
    # versions before 0.6.4 can be made to hang by a hostile server (CVE-2026-30922,
    # CVE-2026-59884, CVE-2026-59885, CVE-2026-59886).
    "pyasn1>=0.6.4",
    "rich>=12.0.0",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "ldapie[test]",
    # Pinned to a minor version: ruff's formatting style changes between minors and CI checks it
    "ruff>=0.16,<0.17",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.0",
    # Locked here (not fetched with uvx at run time) so CI and releases use reviewed versions
    "pip-audit>=2.10",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/ruslanfialkovskii/ldapie"
Source = "https://github.com/ruslanfialkovskii/ldapie"
"Bug Reports" = "https://github.com/ruslanfialkovskii/ldapie/issues"
Documentation = "https://github.com/ruslanfialkovskii/ldapie#readme"

[project.scripts]
ldapie = "ldapie.ldapie:cli"

[tool.setuptools.dynamic]
version = {attr = "ldapie.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E, F and W replace flake8, I replaces isort, B adds the bugbear checks, and
# PLE/PLW keep the pylint errors and warnings
select = ["E", "F", "W", "I", "B", "PLE", "PLW"]
# Line length is the formatter's job
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ldapie"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.report]
# Applies when pytest runs with --cov (CI does); plain pytest stays fast
fail_under = 75
