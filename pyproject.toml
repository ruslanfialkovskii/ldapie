[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ldapie"
description = "A modern LDAP client CLI tool inspired by HTTPie"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dynamic = ["version"]
authors = [
    {name = "LDAPie Team", email = "ruslan.fialkovsky@gmail.com"}
]
keywords = ["ldap", "cli", "directory", "admin", "tool"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
    "Topic :: Utilities",
]
dependencies = [
    "ldap3>=2.9,<3.0",
    "rich>=12.0.0",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Pinned to a major version: black's style changes yearly and CI checks it
    "black>=26.0,<27",
    "isort>=5.0",
    "flake8>=6.0",
    "pylint>=3.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/ruslanfialkovskii/ldapie"
Source = "https://github.com/ruslanfialkovskii/ldapie"
"Bug Reports" = "https://github.com/ruslanfialkovskii/ldapie/issues"
Documentation = "https://github.com/ruslanfialkovskii/ldapie#readme"

[project.scripts]
ldapie = "ldapie.ldapie:cli"

[tool.setuptools.dynamic]
version = {attr = "ldapie.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
