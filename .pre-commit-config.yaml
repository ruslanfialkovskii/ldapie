# Install the hooks once with: pre-commit install
# Every hook runs the tools from uv.lock (`uv run --frozen`), so the versions
# are the ones CI uses and Dependabot keeps them current.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --frozen make typecheck
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
